name: 'PublishLoud PR Ship Note'
description: 'Build in public from your PRs. Turns commits into X and LinkedIn drafts you review and publish - never auto-posts.'
author: 'PublishLoud'
branding:
  icon: 'edit'
  color: 'purple'
inputs:
  api-key:
    description: 'PublishLoud API key (pl_live_…). Store as a GitHub Actions secret.'
    required: true
  api-base-url:
    description: 'PublishLoud API base URL'
    required: false
    default: 'https://api.baloon.dev'
  on-mode:
    description: 'When to run generation comments: merged (default on merge only for closed events) or opened (also on open / ready_for_review)'
    required: false
    default: 'merged'
  github-token:
    description: 'Fallback token (github.token). Comments appear as github-actions unless a GitHub App is configured.'
    required: false
    default: ${{ github.token }}
  github-app-id:
    description: 'PublishLoud GitHub App ID (for branded bot name + logo on comments)'
    required: false
  github-app-private-key:
    description: 'PublishLoud GitHub App private key PEM (store as a secret; use \\n for newlines)'
    required: false
  github-app-installation-id:
    description: 'Optional installation id. If omitted, resolved from the current repository.'
    required: false
runs:
  using: 'node24'
  main: 'src/index.js'
